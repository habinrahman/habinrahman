    <g class="stagger" style="animation-delay: 1000ms" transform="translate(0, 100)">
      <text class="stat" x="25" y="12.5">Stars Earned:</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">0</text>
    </g>
    <g class="stagger" style="animation-delay: 1150ms" transform="translate(0, 125)">
      <text class="stat" x="25" y="12.5">Public Repositories:</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">30</text>
