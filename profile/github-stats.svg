      <text class="stat" x="440" y="12.5" text-anchor="end">835</text>
    </g>
    <g class="stagger" style="animation-delay: 550ms" transform="translate(0, 25)">
      <text class="stat" x="25" y="12.5">Pull Requests:</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">3</text>
    </g>
    <g class="stagger" style="animation-delay: 700ms" transform="translate(0, 50)">
      <text class="stat" x="25" y="12.5">Issues:</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">0</text>
    </g>
    <g class="stagger" style="animation-delay: 850ms" transform="translate(0, 75)">
      <text class="stat" x="25" y="12.5">Code Reviews:</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">0</text>
