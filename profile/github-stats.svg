<svg
  width="467"
  height="150"
  viewBox="0 0 467 150"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">Habin Abdul Rahman&#39;s GitHub Contributions</title>
  <desc id="descId">Total Contributions (last year): 2070, Pull Requests: 4, Public Repositories: 32</desc>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .stat { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #38bdae; }
    .stagger { opacity: 0; animation: fadeIn 0.3s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="466" height="149" fill="#1a1b27" stroke="#e4e2e2"/>
  <g transform="translate(0, 0)">
    <text x="25" y="35" class="header">Habin Abdul Rahman&#39;s GitHub Contributions</text>
  </g>
  <g transform="translate(0, 55)">
    <g class="stagger" style="animation-delay: 400ms" transform="translate(0, 0)">
      <text class="stat" x="25" y="12.5">Total Contributions (last year):</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">2070</text>
    </g>
    <g class="stagger" style="animation-delay: 550ms" transform="translate(0, 25)">
      <text class="stat" x="25" y="12.5">Pull Requests:</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">4</text>
    </g>
    <g class="stagger" style="animation-delay: 700ms" transform="translate(0, 50)">
      <text class="stat" x="25" y="12.5">Public Repositories:</text>
      <text class="stat" x="440" y="12.5" text-anchor="end">32</text>
    </g>
  </g>
</svg>
