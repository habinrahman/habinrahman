  height="225"
  viewBox="0 0 467 225"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">Habin Abdul Rahman&#39;s GitHub Contributions</title>
  <desc id="descId">Total Contributions (last year): 835, Pull Requests: 3, Issues: 0, Code Reviews: 0, Stars Earned: 0, Public Repositories: 30</desc>
