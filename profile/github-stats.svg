    .stagger { opacity: 0; animation: fadeIn 0.3s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="466" height="224" fill="#1a1b27" stroke="#e4e2e2"/>
  <g transform="translate(0, 0)">
